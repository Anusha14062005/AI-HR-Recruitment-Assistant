{% extends "base.html" %}

{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="rounded-circle bg-light d-inline-flex p-4 mb-3">
        <i class="bi bi-question-circle text-muted" style="font-size: 3.5rem;"></i>
    </div>
    <h2 class="fw-bold text-dark">404 - Page Not Found</h2>
    <p class="text-secondary">The resource or candidate profile you requested could not be located.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary mt-2">
        <i class="bi bi-house-door me-1"></i> Return to Dashboard
    </a>
</div>
{% endblock %}
