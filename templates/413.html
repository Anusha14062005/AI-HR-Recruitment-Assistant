{% extends "base.html" %}

{% block title %}File Too Large (413){% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="rounded-circle bg-warning-subtle d-inline-flex p-4 mb-3 text-warning">
        <i class="bi bi-file-earmark-excel" style="font-size: 3.5rem;"></i>
    </div>
    <h2 class="fw-bold text-dark">File Size Limit Exceeded</h2>
    <p class="text-secondary">The uploaded resume exceeds our 16 MB maximum size restriction. Please upload a smaller PDF or DOCX file.</p>
    <a href="{{ url_for('resumes.analyzer_page') }}" class="btn btn-primary mt-2">
        <i class="bi bi-cloud-arrow-up me-1"></i> Try Another Resume
    </a>
</div>
{% endblock %}
