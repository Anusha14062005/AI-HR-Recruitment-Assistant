<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Registration - AI HR Recruitment Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .auth-card {
            background: #ffffff;
            border-radius: 1.25rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.25);
            max-width: 500px;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="auth-card p-4 p-md-5 my-5">
    <div class="text-center mb-4">
        <div class="bg-primary text-white rounded-3 p-3 d-inline-flex align-items-center justify-content-center mb-3 shadow">
            <i class="bi bi-person-plus-fill fs-3"></i>
        </div>
        <h4 class="fw-bold text-dark mb-1">Create HR Account</h4>
        <p class="text-muted small">Register for the AI Recruitment Management Platform</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show small" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.register') }}">
        <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">Full Name</label>
            <input type="text" name="name" class="form-control" placeholder="e.g. Alex Morgan" value="{{ name or '' }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">Work Email</label>
            <input type="email" name="email" class="form-control" placeholder="alex@company.com" value="{{ email or '' }}" required>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label small fw-semibold text-secondary">Company Name</label>
                <input type="text" name="company" class="form-control" placeholder="Acme Global" value="{{ company or 'TalentFlow' }}">
            </div>
            <div class="col-md-6">
                <label class="form-label small fw-semibold text-secondary">HR Role</label>
                <input type="text" name="role" class="form-control" placeholder="e.g. Senior Recruiter" value="{{ role or 'HR Specialist' }}">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">Password (min. 6 characters)</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="mb-4">
            <label class="form-label small fw-semibold text-secondary">Confirm Password</label>
            <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm mb-3">
            <i class="bi bi-check2-circle me-1"></i> Register Account
        </button>

        <div class="text-center">
            <small class="text-muted">Already registered? <a href="{{ url_for('auth.login') }}" class="text-primary fw-semibold text-decoration-none">Sign In</a></small>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
